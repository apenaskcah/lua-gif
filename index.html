<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lua GIF Generator - Transformice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}
  body {
    background: #060608;
    color: #f4f4f5;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 3rem 1rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
  }

  .wrap {
    width: 100%;
    max-width: 960px;
    background: #111115;
    padding: 2.5rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2rem;
    letter-spacing: -0.025em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h2::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 18px;
    background: #6366f1;
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
  }

  .drop-zone {
    border: 2px dashed rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 3rem 1.5rem;
    text-align: center;
    cursor: pointer;
    background: #16161a;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 1.5rem;
  }
  .drop-zone:hover {
    background: #1c1c22;
    border-color: #6366f1;
    transform: translateY(-2px);
    box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.2);
  }
  .drop-zone p {
    font-size: 14px;
    color: #e4e4e7;
    font-weight: 500;
  }
  .drop-zone b { color: #818cf8; }

  .preview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 1.5rem;
    display: none;
  }
  .preview-box {
    background: #16161a;
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
  }
  .preview-box h3 {
    font-size: 11px;
    color: #71717a;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .preview-box .canvas-wrap {
    background: #0d0d10;
    border-radius: 10px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 12px;
    flex-grow: 1;
    border: 1px solid rgba(255, 255, 255, 0.02);
  }
  .preview-box img, .preview-box canvas {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 1.25rem;
  }
  .ctrl-group {
    background: #16161a;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    transition: border-color 0.2s;
  }
  .ctrl-group:hover {
    border-color: rgba(255, 255, 255, 0.08);
  }
  .ctrl-group label {
    font-size: 12px;
    color: #a1a1aa;
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .ctrl-group .val {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    margin-top: 6px;
  }

  input[type=range] {
    width: 100%;
    accent-color: #6366f1;
    cursor: pointer;
  }
  input[type=number], input[type=text] {
    width: 100%;
    padding: 10px 14px;
    background: #0d0d10;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #fff;
    border-radius: 9px;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
  }
  input[type=number]:focus, input[type=text]:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  
  .toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #27272a; transition: .2s; border-radius: 22px;
  }
  .slider:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
    background-color: white; transition: .2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: #6366f1; }
  input:checked + .slider:before { transform: translateX(22px); }

  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .stat {
    background: #16161a;
    border-radius: 12px;
    padding: 16px 20px;
    flex: 1;
    min-width: 130px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  .stat .num { font-size: 22px; font-weight: 700; color: #fff; }
  .stat .lbl { font-size: 11px; color: #71717a; margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  
  .btn-gen {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    background: #6366f1;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    margin-bottom: 1.5rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
  }
  .btn-gen:hover:not(:disabled) {
    background: #4f46e5;
    transform: translateY(-1px);
    box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
  }
  .btn-gen:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  
  .code-area {
    display: none;
    background: #16161a;
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 1.5rem;
  }
  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .code-header span { font-size: 12px; color: #a1a1aa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .copy-btn {
    font-size: 12px;
    padding: 6px 14px;
    border: none;
    border-radius: 8px;
    background: #27272a;
    cursor: pointer;
    color: #fff;
    font-weight: 500;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: #3f3f46; }
  .code-area textarea {
    width: 100%;
    height: 240px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    resize: vertical;
    background: #0d0d10;
    color: #e4e4e7;
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    padding: 14px;
    outline: none;
  }
  #file-input { display: none; }
  
  .warning {
    font-size: 12px;
    color: #fca5a5;
    background: rgba(127, 29, 29, 0.15);
    border: 1px solid rgba(153, 27, 27, 0.3);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 1.5rem;
    display: none;
    font-weight: 500;
  }
  .progress-bar {
    width: 100%;
    background: #16161a;
    border-radius: 8px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    display: none;
    border: 1px solid rgba(255, 255, 255, 0.02);
  }
  .progress-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.2s; }

  /* Estilização para centralizar os anúncios */
  .ad-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px; /* Espaço entre os dois anúncios */
    width: 100%;
    margin-top: 1.5rem;
    overflow: hidden;
  }
</style>

<body>
<div class="wrap">

<script>
let gifFramesData = []; 
let frameDelays = [];
let detectedRef = 8;
let originalFileUrl = null;
let animTimeout = null;

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const wSlider = document.getElementById('w-slider');
const hSlider = document.getElementById('h-slider');
const wVal = document.getElementById('w-val');
const hVal = document.getElementById('h-val');
const genBtn = document.getElementById('btn-gen');
const codeOut = document.getElementById('code-out');
const speedInput = document.getElementById('speed-input');
const scaleInput = document.getElementById('scale-input');
const codeTitleLabel = document.getElementById('code-title-label');
const stFrames = document.getElementById('st-frames');

const previewCanvas = document.getElementById('canvas-preview');
const ctxPreview = previewCanvas.getContext('2d', { willReadFrequently: true });

const fixedToggle = document.getElementById('fixed-toggle');
const fixedStatusText = document.getElementById('fixed-status-text');

fixedToggle.addEventListener('change', () => {
  fixedStatusText.textContent = fixedToggle.checked ? 'true' : 'false';
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
dropZone.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); });
dropZone.addEventListener('drop', e => { 
  e.preventDefault(); 
  e.stopPropagation();
  const f = e.dataTransfer.files[0]; 
  if (f && (f.type === 'image/gif' || f.name.toLowerCase().endsWith('.gif'))) {
    loadGif(f);
  } else {
    alert('please send an .gif file');
  }
});
fileInput.addEventListener('change', () => { 
  if (fileInput.files[0]) {
    loadGif(fileInput.files[0]);
  }
});

function updateDimensionsBasedOnAspect(origW, origH) {
  if (!origW || !origH) return;
  const ratio = origW / origH;
  let targetH = Math.round(Math.sqrt(300 / ratio));
  let targetW = Math.round(targetH * ratio);
  
  if (targetW < 5) targetW = 5;
  if (targetH < 5) targetH = 5;
  if (targetW > 150) targetW = 150;
  if (targetH > 150) targetH = 150;

  wSlider.value = targetW;
  hSlider.value = targetH;
  wVal.textContent = targetW + ' px';
  hVal.textContent = targetH + ' px';
}

wSlider.addEventListener('input', () => { 
  wVal.textContent = wSlider.value + ' px'; 
  checkLagWarning();
});
hSlider.addEventListener('input', () => { 
  hVal.textContent = hSlider.value + ' px'; 
  checkLagWarning();
});

speedInput.addEventListener('input', () => {
  if (gifFramesData.length > 0) {
    startRightPreviewAnimation();
  }
  checkLagWarning();
});

function checkLagWarning() {
  const speedVal = parseInt(speedInput.value) || 0;
  const targetW = parseInt(wSlider.value) || 0;
  const targetH = parseInt(hSlider.value) || 0;
  
  const product = (targetW * targetH) * speedVal;
  const warningElem = document.getElementById('warning');
  
  if (product > 3500) {
    warningElem.style.display = 'block';
  } else {
    warningElem.style.display = 'none';
  }
}

document.getElementById('copy-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(codeOut.value).then(() => {
    const b = document.getElementById('copy-btn');
    b.textContent = '✓ Copied!';
    setTimeout(() => { b.textContent = 'Copy Code'; }, 2000);
  });
});

genBtn.addEventListener('click', processAndGenerateLua);

async function loadGif(file) {
  document.getElementById('drop-text').textContent = file.name;
  
  if (originalFileUrl) URL.revokeObjectURL(originalFileUrl);
  originalFileUrl = URL.createObjectURL(file);
  
  const imgElem = document.getElementById('img-original');
  imgElem.src = originalFileUrl;
  document.getElementById('preview-grid').style.display = 'grid';

  const bar = document.getElementById('prog-bar');
  const fill = document.getElementById('prog-fill');
  bar.style.display = 'block';
  fill.style.width = '40%';

  try {
    if (window.ImageDecoder) {
      const decoder = new ImageDecoder({ data: file.stream(), type: 'image/gif' });
      await decoder.tracks.ready;
      const frameCount = decoder.tracks.selectedTrack.frameCount;
      gifFramesData = [];
      frameDelays = [];

      const tempCanvas = document.createElement('canvas');
      const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

      for (let i = 0; i < frameCount; i++) {
        const frameResult = await decoder.decode({ frameIndex: i });
        const videoFrame = frameResult.image;
        
        let durationMs = frameResult.duration ? frameResult.duration / 1000 : 100;
        if (durationMs < 20) durationMs = 100; 
        frameDelays.push(durationMs);
        
        if (i === 0) {
          tempCanvas.width = videoFrame.codedWidth;
          tempCanvas.height = videoFrame.codedHeight;
          updateDimensionsBasedOnAspect(videoFrame.codedWidth, videoFrame.codedHeight);
        }

        tCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        tCtx.drawImage(videoFrame, 0, 0);
        const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

        gifFramesData.push({
          data: new Uint8ClampedArray(imgData.data),
          width: tempCanvas.width,
          height: tempCanvas.height
        });
        
        videoFrame.close();
      }
    } else {
      throw new Error("Seu navegador não suporta decodificação nativa de múltiplos frames.");
    }

    fill.style.width = '100%';
    setTimeout(() => { bar.style.display = 'none'; }, 400);

    const frameCount = gifFramesData.length;
    detectedRef = 8;
    
    speedInput.value = detectedRef;
    speedInput.placeholder = detectedRef;

    stFrames.textContent = frameCount;
    genBtn.disabled = false;

    startRightPreviewAnimation();
    checkLagWarning();

  } catch (err) {
    bar.style.display = 'none';
    console.error(err);
    alert('Erro detalhado ao decodificar o GIF:\n\n' + err.message);
  }
}

function startRightPreviewAnimation() {
  if (animTimeout) clearTimeout(animTimeout);
  let currentPreviewFrame = 0;

  let speedVal = parseInt(speedInput.value) || detectedRef;
  if (speedVal < 1) speedVal = 1;

  function playNextFrame() {
    if (gifFramesData.length === 0) return;
    const targetW = parseInt(wSlider.value);
    const targetH = parseInt(hSlider.value);
    
    previewCanvas.width = targetW;
    previewCanvas.height = targetH;
    ctxPreview.imageSmoothingEnabled = false;

    const frame = gifFramesData[currentPreviewFrame];
    const bigCanvas = document.createElement('canvas');
    bigCanvas.width = frame.width;
    bigCanvas.height = frame.height;
    bigCanvas.getContext('2d').putImageData(new ImageData(frame.data, frame.width, frame.height), 0, 0);

    ctxPreview.clearRect(0, 0, targetW, targetH);
    ctxPreview.drawImage(bigCanvas, 0, 0, frame.width, frame.height, 0, 0, targetW, targetH);

    let rawDelay = frameDelays[currentPreviewFrame] || 100;
    let adjustedDelay = rawDelay * (8 / speedVal);
    if (adjustedDelay < 10) adjustedDelay = 10;

    currentPreviewFrame = (currentPreviewFrame + 1) % gifFramesData.length;
    animTimeout = setTimeout(playNextFrame, adjustedDelay);
  }

  playNextFrame();
}

function toHex(r, g, b) {
  return ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function colorKey(r, g, b) { return (r << 16) | (g << 8) | b; }

function extractRectsFromFrame(frameRgba, srcW, srcH, targetW, targetH, thresh) {
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = targetW;
  tmpCanvas.height = targetH;
  const tCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });
  tCtx.imageSmoothingEnabled = false;

  const bigCanvas = document.createElement('canvas');
  bigCanvas.width = srcW;
  bigCanvas.height = srcH;
  bigCanvas.getContext('2d').putImageData(new ImageData(frameRgba, srcW, srcH), 0, 0);

  tCtx.drawImage(bigCanvas, 0, 0, srcW, srcH, 0, 0, targetW, targetH);
  const smallPixels = tCtx.getImageData(0, 0, targetW, targetH).data;

  const rects = [];
  const W = targetW;
  const H = targetH;

  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const idx = (y * W + x) * 4;
      const a = smallPixels[idx+3];
      if (a <= thresh) { x++; continue; }
      const r = smallPixels[idx], g = smallPixels[idx+1], b = smallPixels[idx+2];
      const key = colorKey(r, g, b);
      let x2 = x + 1;
      while (x2 < W) {
        const i2 = (y * W + x2) * 4;
        if (smallPixels[i2+3] <= thresh) break;
        if (colorKey(smallPixels[i2], smallPixels[i2+1], smallPixels[i2+2]) !== key) break;
        x2++;
      }
      rects.push({ x, y, w: x2 - x, h: 1, r, g, b });
      x = x2;
    }
  }
  return rects;
}

function processAndGenerateLua() {
  if (gifFramesData.length === 0) return;

  const targetW = parseInt(wSlider.value);
  const targetH = parseInt(hSlider.value);
  const offsetX = parseInt(document.getElementById('offset-x').value) || 0;
  const offsetY = parseInt(document.getElementById('offset-y').value) || 0;
  const playerName = document.getElementById('player-name').value.trim() || "Nickname#0000";
  const speedVal = parseInt(speedInput.value) || detectedRef;
  const scaleVal = parseFloat(scaleInput.value) || 1;
  const isFixed = fixedToggle.checked ? 'true' : 'false';
  const thresh = 10; 

  let totalBlocksMax = 0;
  const luaLines = [];
  
  luaLines.push('-- made by Kcah#2475 & G484#5825');
  luaLines.push('tfm.exec.disableAutoNewGame(true)');
  luaLines.push('');

  let framesString = 'local frames = {';
  for (let i = 0; i < gifFramesData.length; i++) {
    const frame = gifFramesData[i];
    const rects = extractRectsFromFrame(frame.data, frame.width, frame.height, targetW, targetH, thresh);
    if (rects.length > totalBlocksMax) totalBlocksMax = rects.length;

    framesString += '{';
    for (let r = 0; r < rects.length; r++) {
      const rc = rects[r];
      const hex = toHex(rc.r, rc.g, rc.b);
      const finalX = Math.floor(offsetX + (rc.x * scaleVal));
      const finalY = Math.floor(offsetY + (rc.y * scaleVal));
      const finalW = Math.ceil(rc.w * scaleVal);
      const finalH = Math.ceil(rc.h * scaleVal);

      framesString += `{${finalX},${finalY},${finalW},${finalH},0x${hex}},`;
    }
    framesString += '},';
  }
  framesString += '}';

  luaLines.push(framesString);
  luaLines.push('');
  luaLines.push('local function desenharTela(id)');
  luaLines.push('    local currentFrame = frames[id + 1]');
  luaLines.push('    if not currentFrame then return end');
  luaLines.push('    for i = 1, #currentFrame do');
  luaLines.push('        local rect = currentFrame[i]');
  luaLines.push('        ui.addTextArea(i, "", nil, rect[1], rect[2], rect[3], rect[4], rect[5], rect[5], 1, ' + isFixed + ')');
  luaLines.push('    end');
  luaLines.push('end');
  luaLines.push('');
  luaLines.push('local id = 0');
  luaLines.push('tfm.exec.setVampirePlayer("' + playerName + '", true)');
  luaLines.push('local time = os.time()');
  luaLines.push('');
  luaLines.push('eventPlayerVampire = function(name)');
  luaLines.push('    tfm.exec.setVampirePlayer(name, false)');
  luaLines.push('    if name == "' + playerName + '" then');
  luaLines.push('        tfm.exec.setVampirePlayer(name, true)');
  luaLines.push('        if os.time() > time then');
  luaLines.push('            time = os.time() + 1000 / ' + speedVal);
  luaLines.push('            desenharTela(id)');
  luaLines.push('            id = (id + 1) % #' + 'frames');
  luaLines.push('        end');
  luaLines.push('    end');
  luaLines.push('end');

  codeOut.value = luaLines.join('\n');
  
  const lagProduct = totalBlocksMax * speedVal;
  document.getElementById('code-area').style.display = 'block';
  document.getElementById('warning').style.display = lagProduct > 3500 ? 'block' : 'none';
  
  codeTitleLabel.textContent = `Generated Lua Code (${totalBlocksMax} max blocks)`;
  codeOut.scrollTop = 0;
}
</script>
</body>
