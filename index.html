<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lua GIF Generator - Transformice</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body {
    background: #141417;
    color: #e1e1e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  .wrap{max-width:900px;margin:0 auto;background:#1e1e24;padding:2rem;border-radius:12px;border:1px solid #2a2a35;}
  h2{font-size:20px;font-weight:600;color:#fff;margin-bottom:6px}
  .sub{font-size:13px;color:#9ca3af;margin-bottom:1.5rem}
  .drop-zone{border:2px dashed #3f3f46;border-radius:8px;padding:2rem;text-align:center;cursor:pointer;background:#27272a;transition:background 0.15s;margin-bottom:1.25rem}
  .drop-zone:hover{background:#323238}
  .drop-zone p{font-size:14px;color:#a1a1aa}
  
  .preview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 1.25rem;
    display: none;
  }
  .preview-box {
    background: #121215;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
  }
  .preview-box h3 {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .preview-box .canvas-wrap {
    background: #18181b;
    border-radius: 6px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 8px;
    flex-grow: 1;
  }
  .preview-box img, .preview-box canvas {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.25rem}
  .ctrl-group label{font-size:12px;color:#a1a1aa;display:block;margin-bottom:6px}
  .ctrl-group .val{font-size:13px;font-weight:500;color:#fff;margin-top:4px}
  input[type=range] { width: 100%; accent-color: #6366f1; }
  input[type=number], input[type=text] { width: 100%; padding: 8px; background: #27272a; border: 1px solid #3f3f46; color: #fff; border-radius: 6px; font-size: 13px; }
  
  .toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #27272a;
    border: 1px solid #3f3f46;
    padding: 10px 14px;
    border-radius: 6px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #3f3f46; transition: .2s; border-radius: 22px;
  }
  .slider:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
    background-color: white; transition: .2s; border-radius: 50%;
  }
  input:checked + .slider { background-color: #4f46e5; }
  input:checked + .slider:before { transform: translateX(22px); }

  .stats{display:flex;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
  .stat{background:#27272a;border-radius:8px;padding:12px 16px;flex:1;min-width:110px;border:1px solid #3f3f46}
  .stat .num{font-size:22px;font-weight:600;color:#fff}
  .stat .lbl{font-size:11px;color:#a1a1aa}
  
  .btn-gen{width:100%;padding:12px;font-size:15px;font-weight:600;background:#4f46e5;border:none;border-radius:8px;cursor:pointer;color:#fff;margin-bottom:16px;transition:background 0.15s}
  .btn-gen:hover{background:#4338ca}
  .btn-gen:disabled{opacity:0.4;cursor:not-allowed}
  
  .code-area{display:none;background:#18181b;border:1px solid #3f3f46;border-radius:8px;padding:16px;margin-bottom:16px}
  .code-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .code-header span{font-size:13px;color:#a1a1aa}
  .copy-btn{font-size:12px;padding:6px 14px;border:none;border-radius:6px;background:#3f3f46;cursor:pointer;color:#fff;transition:background 0.15s}
  .copy-btn:hover{background:#52525b}
  .code-area textarea{width:100%;height:220px;font-family:monospace;font-size:11px;resize:vertical;background:#09090b;color:#e4e4e7;border:1px solid #27272a;border-radius:6px;padding:8px}
  #file-input{display:none}
  .warning{font-size:12px;color:#fca5a5;background:#7f1d1d;border:1px solid #991b1b;border-radius:8px;padding:10px 14px;margin-bottom:16px;display:none}
  .progress-bar { width: 100%; background: #27272a; border-radius: 4px; height: 8px; overflow: hidden; margin-bottom: 16px; display: none; }
  .progress-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.2s; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Lua GIF Generator - Transformice</h2>

  <div class="drop-zone" id="drop-zone">
    <p id="drop-text">Clique ou arraste um arquivo <b>.gif</b> aqui</p>
    <p style="font-size:11px;margin-top:4px;color:#71717a">only .gif files</p>
  </div>
  <input type="file" id="file-input" accept=".gif,image/gif">

  <div class="preview-grid" id="preview-grid">
    <div class="preview-box">
      <h3>Original GIF</h3>
      <div class="canvas-wrap">
        <img id="img-original" alt="Original">
      </div>
    </div>
    <div class="preview-box">
      <h3>Preview</h3>
      <div class="canvas-wrap">
        <canvas id="canvas-preview"></canvas>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>Resolution X</label>
      <input type="range" id="w-slider" min="10" max="100" value="20" step="1">
      <div class="val" id="w-val">20 px</div>
    </div>
    <div class="ctrl-group">
      <label>Resolution Y</label>
      <input type="range" id="h-slider" min="10" max="80" value="20" step="1">
      <div class="val" id="h-val">20 px</div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>OffsetX</label>
      <input type="number" id="offset-x" value="0" min="0" max="800">
    </div>
    <div class="ctrl-group">
      <label>OffsetY</label>
      <input type="number" id="offset-y" value="0" min="0" max="400">
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>Vampire</label>
      <input type="text" id="player-name" value="Nickname#0000" placeholder="Ex: Rato#0000">
    </div>
    <div class="ctrl-group">
      <label>Fixed</label>
      <div class="toggle-container">
        <span id="fixed-status-text" style="font-size:13px; font-weight:500; color:#fff;">false</span>
        <label class="switch">
          <input type="checkbox" id="fixed-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="progress-bar" id="prog-bar"><div class="progress-fill" id="prog-fill"></div></div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="num" id="st-frames">0</div><div class="lbl">Frames Detected</div></div>
    <div class="stat"><div class="num" id="st-rep">8</div><div class="lbl">Speed</div></div>
  </div>

  <div class="warning" id="warning">⚠️ Muitos elementos detectados! Reduza a resolução interna para evitar lags ou desconexões no Transformice.</div>

  <button class="btn-gen" id="gen-btn" disabled>Generate Lua Code</button>

  <div class="code-area" id="code-area">
    <div class="code-header">
      <span>Generated Lua Code</span>
      <button class="copy-btn" id="copy-btn">Copy Code</button>
    </div>
    <textarea id="code-out" readonly></textarea>
  </div>
</div>

<script>
let gifFramesData = []; 
let detectedRep = 8;
let originalFileUrl = null;
let animInterval = null;

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const wSlider = document.getElementById('w-slider');
const hSlider = document.getElementById('h-slider');
const wVal = document.getElementById('w-val');
const hVal = document.getElementById('h-val');
const genBtn = document.getElementById('gen-btn');
const codeOut = document.getElementById('code-out');

const previewCanvas = document.getElementById('canvas-preview');
const ctxPreview = previewCanvas.getContext('2d', { willReadFrequently: true });

const fixedToggle = document.getElementById('fixed-toggle');
const fixedStatusText = document.getElementById('fixed-status-text');

fixedToggle.addEventListener('change', () => {
  fixedStatusText.textContent = fixedToggle.checked ? 'true' : 'false';
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
dropZone.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); });
dropZone.addEventListener('drop', e => { 
  e.preventDefault(); 
  e.stopPropagation();
  const f = e.dataTransfer.files[0]; 
  if (f && (f.type === 'image/gif' || f.name.toLowerCase().endsWith('.gif'))) {
    loadGif(f);
  } else {
    alert('Only .gif files!');
  }
});
fileInput.addEventListener('change', () => { 
  if (fileInput.files[0]) {
    loadGif(fileInput.files[0]);
  }
});

wSlider.addEventListener('input', () => { 
  wVal.textContent = wSlider.value + ' px'; 
});
hSlider.addEventListener('input', () => { 
  hVal.textContent = hSlider.value + ' px'; 
});

document.getElementById('copy-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(codeOut.value).then(() => {
    const b = document.getElementById('copy-btn');
    b.textContent = '✓ Copied!';
    setTimeout(() => { b.textContent = 'Copy Code'; }, 2000);
  });
});

genBtn.addEventListener('click', processAndGenerateLua);

async function loadGif(file) {
  document.getElementById('drop-text').textContent = file.name;
  
  if (originalFileUrl) URL.revokeObjectURL(originalFileUrl);
  originalFileUrl = URL.createObjectURL(file);
  
  const imgElem = document.getElementById('img-original');
  imgElem.src = originalFileUrl;
  document.getElementById('preview-grid').style.display = 'grid';

  const bar = document.getElementById('prog-bar');
  const fill = document.getElementById('prog-fill');
  bar.style.display = 'block';
  fill.style.width = '40%';

  try {
    if (window.ImageDecoder) {
      const decoder = new ImageDecoder({ data: file.stream(), type: 'image/gif' });
      await decoder.tracks.ready;
      const frameCount = decoder.tracks.selectedTrack.frameCount;
      gifFramesData = [];

      const tempCanvas = document.createElement('canvas');
      const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

      for (let i = 0; i < frameCount; i++) {
        const frameResult = await decoder.decode({ frameIndex: i });
        const videoFrame = frameResult.image;
        
        if (i === 0) {
          tempCanvas.width = videoFrame.codedWidth;
          tempCanvas.height = videoFrame.codedHeight;
        }

        tCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        tCtx.drawImage(videoFrame, 0, 0);
        const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

        gifFramesData.push({
          data: new Uint8ClampedArray(imgData.data),
          width: tempCanvas.width,
          height: tempCanvas.height
        });
        
        videoFrame.close();
      }
    } else {
      throw new Error("Seu navegador não suporta decodificação nativa de múltiplos frames. Atualize o Chrome ou Edge.");
    }

    fill.style.width = '100%';
    setTimeout(() => { bar.style.display = 'none'; }, 400);

    const frameCount = gifFramesData.length;
    detectedRef = frameCount <= 12 ? 8 : 12;
    document.getElementById('st-frames').textContent = frameCount;
    document.getElementById('st-rep').textContent = detectedRef;
    document.getElementById('stats').style.display = 'flex';
    genBtn.disabled = false;

    startRightPreviewAnimation();

  } catch (err) {
    bar.style.display = 'none';
    console.error(err);
    alert('Erro detalhado ao decodificar o GIF:\n\n' + err.message);
  }
}

function startRightPreviewAnimation() {
  if (animInterval) clearInterval(animInterval);
  let currentPreviewFrame = 0;

  animInterval = setInterval(() => {
    if (gifFramesData.length === 0) return;
    const targetW = parseInt(wSlider.value);
    const targetH = parseInt(hSlider.value);
    
    previewCanvas.width = targetW;
    previewCanvas.height = targetH;
    ctxPreview.imageSmoothingEnabled = false;

    const frame = gifFramesData[currentPreviewFrame];
    const bigCanvas = document.createElement('canvas');
    bigCanvas.width = frame.width;
    bigCanvas.height = frame.height;
    bigCanvas.getContext('2d').putImageData(new ImageData(frame.data, frame.width, frame.height), 0, 0);

    ctxPreview.clearRect(0, 0, targetW, targetH);
    ctxPreview.drawImage(bigCanvas, 0, 0, frame.width, frame.height, 0, 0, targetW, targetH);

    currentPreviewFrame = (currentPreviewFrame + 1) % gifFramesData.length;
  }, 1000 / 12);
}

function toHex(r, g, b) {
  return ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function colorKey(r, g, b) { return (r << 16) | (g << 8) | b; }

function extractRectsFromFrame(frameRgba, srcW, srcH, targetW, targetH, thresh) {
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = targetW;
  tmpCanvas.height = targetH;
  const tCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });
  tCtx.imageSmoothingEnabled = false;

  const bigCanvas = document.createElement('canvas');
  bigCanvas.width = srcW;
  bigCanvas.height = srcH;
  bigCanvas.getContext('2d').putImageData(new ImageData(frameRgba, srcW, srcH), 0, 0);

  tCtx.drawImage(bigCanvas, 0, 0, srcW, srcH, 0, 0, targetW, targetH);
  const smallPixels = tCtx.getImageData(0, 0, targetW, targetH).data;

  const rects = [];
  const W = targetW;
  const H = targetH;

  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const idx = (y * W + x) * 4;
      const a = smallPixels[idx+3];
      if (a <= thresh) { x++; continue; }
      const r = smallPixels[idx], g = smallPixels[idx+1], b = smallPixels[idx+2];
      const key = colorKey(r, g, b);
      let x2 = x + 1;
      while (x2 < W) {
        const i2 = (y * W + x2) * 4;
        if (smallPixels[i2+3] <= thresh) break;
        if (colorKey(smallPixels[i2], smallPixels[i2+1], smallPixels[i2+2]) !== key) break;
        x2++;
      }
      rects.push({ x, y, w: x2 - x, h: 1, r, g, b });
      x = x2;
    }
  }
  return rects;
}

function processAndGenerateLua() {
  if (gifFramesData.length === 0) return;

  const targetW = parseInt(wSlider.value);
  const targetH = parseInt(hSlider.value);
  const offsetX = parseInt(document.getElementById('offset-x').value) || 0;
  const offsetY = parseInt(document.getElementById('offset-y').value) || 0;
  const playerName = document.getElementById('player-name').value.trim() || "Nickname#0000";
  const isFixed = fixedToggle.checked ? 'true' : 'false';
  const thresh = 10; 

  const scaleX = 800 / targetW;
  const scaleY = 400 / targetH;

  let totalBlocksMax = 0;
  const luaLines = [];
  
  luaLines.push('-- made by Kcah#2475 & G484#5825');
  luaLines.push('tfm.exec.disableAutoNewGame(true)');
  luaLines.push('');
  luaLines.push('local function desenharTela(id)');

  for (let i = 0; i < gifFramesData.length; i++) {
    const frame = gifFramesData[i];
    const rects = extractRectsFromFrame(frame.data, frame.width, frame.height, targetW, targetH, thresh);
    if (rects.length > totalBlocksMax) totalBlocksMax = rects.length;

    if (i === 0) {
      luaLines.push('  if id == 0 then');
    } else {
      luaLines.push('  elseif id == ' + i + ' then');
    }

    for (let r = 0; r < rects.length; r++) {
      const rc = rects[r];
      const hex = toHex(rc.r, rc.g, rc.b);
      const finalX = Math.floor(offsetX + (rc.x * scaleX));
      const finalY = Math.floor(offsetY + (rc.y * scaleY));
      const finalW = Math.ceil(rc.w * scaleX);
      const finalH = Math.ceil(rc.h * scaleY);

      luaLines.push('    ui.addTextArea(' + r + ', "", nil, ' + finalX + ', ' + finalY + ', ' + finalW + ', ' + finalH + ', 0x' + hex + ', 0x' + hex + ', 1, ' + isFixed + ')');
    }
  }

  luaLines.push('  end');
  luaLines.push('end');
  luaLines.push('');
  luaLines.push('local id = 0');
  luaLines.push('tfm.exec.setVampirePlayer("' + playerName + '", true)');
  luaLines.push('local time = os.time()');
  luaLines.push('');
  luaLines.push('eventPlayerVampire = function(name)');
  luaLines.push('    tfm.exec.setVampirePlayer(name, false)');
  luaLines.push('    if name == "' + playerName + '" then');
  luaLines.push('        tfm.exec.setVampirePlayer(name, true)');
  luaLines.push('        if os.time() > time then');
  luaLines.push('            time = os.time() + 1000 / ' + (typeof detectedRef !== 'undefined' ? detectedRef : 8));
  luaLines.push('            desenharTela(id)');
  luaLines.push('            id = id + 1');
  luaLines.push('            if id >= ' + gifFramesData.length + ' then');
  luaLines.push('                id = 0');
  luaLines.push('            end');
  luaLines.push('        end');
  luaLines.push('    end');
  luaLines.push('end');

  codeOut.value = luaLines.join('\n');
  document.getElementById('code-area').style.display = 'block';
  document.getElementById('st-blocks').textContent = totalBlocksMax;
  document.getElementById('warning').style.display = totalBlocksMax > 500 ? 'block' : 'none';
  codeOut.scrollTop = 0;
}
</script>
</body>
</html>
